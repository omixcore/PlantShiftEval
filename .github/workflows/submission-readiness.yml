name: Submission readiness evidence gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submission-readiness.yml"
      - "src/dinov2_linear_probe.py"
      - "src/target_bootstrap.py"
      - "src/audit_manuscript.py"
      - "src/update_manuscript_baseline.py"
      - "src/export_submission_docx.py"
      - "tests/test_submission_readiness.py"

permissions:
  contents: write

concurrency:
  group: submission-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pyarrow==26.0.0 Pillow==12.3.0 python-docx==1.2.0
      - name: Compile source and run submission-readiness tests
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Reproduce all 65 archived metric sets
        run: python src/reproduce_public_results.py
      - name: Calculate target class metrics and bootstrap intervals
        run: python src/target_bootstrap.py --bootstrap 5000
      - name: Fetch pinned data and verify source checksums
        run: python src/fetch_study_data.py
      - name: Prepare source group split and official target holdout
        run: |
          python src/prepare_corrected_data.py
          python src/prepare_corrected_data.py --target
      - name: Evaluate frozen DINOv2-S/14 linear probe
        run: python src/dinov2_linear_probe.py --device cpu --batch-size 16 --threads 2
      - name: Recalculate paired target bootstrap with DINOv2
        if: success()
        run: python src/target_bootstrap.py --bootstrap 5000
      - name: Integrate measured baseline into manuscript and positioning
        if: success()
        run: python src/update_manuscript_baseline.py
      - name: Audit all manuscript citations and Crossref metadata
        if: always()
        run: python src/audit_manuscript.py
      - name: Export synchronized editable manuscript DOCX with figures
        if: success()
        run: python src/export_submission_docx.py
      - name: Recheck source syntax and manuscript citation structure
        if: success()
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Upload auditable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantshifteval-submission-readiness
          retention-days: 30
          if-no-files-found: warn
          path: |
            report/additional_baselines/
            report/corrected_summary/target_bootstrap.json
            report/corrected_summary/target_bootstrap.md
            report/corrected_summary/target_per_class_metrics.csv
            report/corrected_summary/public_reproduction.json
            manuscript/PlantShiftEval_corrected_manuscript.md
            manuscript/PlantShiftEval_corrected_manuscript.docx
            README.md
            docs/RESEARCH_POSITIONING.md
      - name: Commit generated evidence and synchronized manuscript
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/additional_baselines report/corrected_summary/target_bootstrap.json report/corrected_summary/target_bootstrap.md report/corrected_summary/target_per_class_metrics.csv report/corrected_summary/public_reproduction.json manuscript/PlantShiftEval_corrected_manuscript.md manuscript/PlantShiftEval_corrected_manuscript.docx README.md docs/RESEARCH_POSITIONING.md
          if git diff --cached --quiet; then
            echo "No generated outputs changed."
          else
            git commit -m "Add DINOv2 baseline and submission-readiness evidence"
            git push
          fi
